[package]
name = "videosift-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "process-test-helper"
path = "tests/support/process_helper.rs"
test = false
bench = false

[[example]]
name = "chinese_search"
test = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }
tokio.workspace = true
process-wrap.workspace = true
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "backup"] }
tempfile = "3"
thiserror = "2"
blake3 = "1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.4", default-features = false, features = ["signal", "process"] }
