[package]
name = "videosift-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "videosift"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json.workspace = true
videosift-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
