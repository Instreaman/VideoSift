[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "process-group", "kill-on-drop", "creation-flags"] }
